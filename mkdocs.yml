# mkdocs.yml - Configuration for MkDocs

site_name: Glass-to-Glass Video Pipelines
site_description: What cheap ARM hardware actually does. Measured video capture, encode, vendor accelerators and hardware CI on a Raspberry Pi 5 and an Orange Pi 6 Plus, with the date, kernel and command behind every number.
repo_url: https://github.com/astavonin/glass-to-glass
site_url: https://gtog.dev

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  icon:
    annotation: material/plus-circle
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - navigation.sections
    - navigation.tabs
    - toc.integrate

extra:
  social:
    - icon: fontawesome/solid/square-rss
      link: https://gtog.dev/feed_rss_created.xml
    - icon: fontawesome/brands/github
      link: https://github.com/astavonin/glass-to-glass
  analytics:
    provider: google
    property: G-8XBZY8WGLD

nav:
  - Home: index.md
  - Video Streaming:
    - video/index.md
    - Camera Sensor Fundamentals: video/camera-sensor-fundamentals.md
    - The Linux Camera Stack: video/linux-camera-stack.md
  - CI:
    - ci/index.md
    - Integration Testing for Linux Video Pipelines: ci/integration-testing.md
  - NPU/GPU:
    - npu-gpu/index.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox
  - include-markdown
  - redirects:
      redirect_maps:
        # Book-era paths. Kept so existing links and search results resolve.
        appendix/A1-camera-sensor-fundamentals.md: video/camera-sensor-fundamentals.md
        appendix/A3-linux-camera-stack.md: video/linux-camera-stack.md
        appendix/index.md: video/index.md
        part01/02-emulation-and-video-testing.md: ci/integration-testing.md
        part01/index.md: video/index.md
        # Retired: duplicated on sysdev.me, and a Rust implementation that is
        # not being ported. Both land on the section that replaced them.
        part01/01-rust-on-pi.md: video/index.md
        part01/03-capture-session.md: video/index.md
        blog/index.md: index.md
  - rss:
      match_path: "(video|ci|npu-gpu)/(?!index).*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
